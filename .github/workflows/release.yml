name: Release

on:
  push:
    branches: [main]
  # Escape hatch: the auto-merge step below merges the Version Packages PR
  # using the workflow's own GITHUB_TOKEN, and GitHub deliberately does not
  # let a GITHUB_TOKEN-authored push re-trigger other workflows (anti-recursion
  # guard) — so that merge does NOT automatically re-run this workflow to
  # publish. workflow_dispatch lets a human (or `gh workflow run`) kick the
  # publish step manually when that happens.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # Either opens/updates a "Version Packages" PR (unreleased changesets
      # exist) or, when that PR was just merged, runs `pnpm release` to
      # publish the new version(s) to npm. GITHUB_TOKEN drives the
      # PR/git operations; NPM_TOKEN (an npm access token, not a GitHub
      # PAT) drives the actual `npm publish` auth.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The Version Packages PR is 100% mechanical (a version bump + changelog
      # entry, no hand-written code) — auto-merge it once its own required
      # checks pass so a release never needs a manual click. This does NOT
      # affect ordinary feature/bugfix PRs, which still need a human to merge.
      - name: Auto-merge the Version Packages PR
        if: steps.changesets.outputs.pullRequestNumber
        run: gh pr merge --auto --merge "${{ steps.changesets.outputs.pullRequestNumber }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
